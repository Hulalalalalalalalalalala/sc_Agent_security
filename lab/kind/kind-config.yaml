# Based on rossoctl v0.8.0 scripts/kind/kind-config-registry.yaml.
# Same node image digest, same host ports (8080, 9443).
# extraMounts adds a docker.io mirror because Docker Hub is unreachable here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Same digest as scripts/kind/kind-config-registry.yaml. The name is the
  # DaoCloud mirror copy already present locally; Docker Hub itself resets
  # connections from this network. `docker image inspect` reported
  # linux/arm64 and RepoDigest sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f.
  image: docker.m.daocloud.io/kindest/node@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
  - containerPort: 30443
    hostPort: 9443
  extraMounts:
  - hostPath: /Users/hulalala/Desktop/A/lab/containerd/certs.d
    containerPath: /etc/containerd/certs.d
containerdConfigPatches:
- |
  [plugins."io.containerd.cri.v1.images".registry]
    config_path = "/etc/containerd/certs.d"
