# Restrict auxiliary AuthBridge ports and the unauthenticated MCP backend port.
# Port 8000 stays reachable so the Service remains the authenticated entry.
# Rollback: kubectl delete -f lab/k8s/weather-tool-diag-netpol.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weather-tool-advanced-aux-limit
  namespace: team1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: weather-tool-advanced
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
