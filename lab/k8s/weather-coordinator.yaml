apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-coordinator
  namespace: team1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-coordinator-script
  namespace: team1
data:
  coordinator.py: |
    # replaced by kubectl create --from-file during apply
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-coordinator
  namespace: team1
  labels:
    app.kubernetes.io/name: weather-coordinator
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-coordinator
        protocol.rossoctl.io/a2a: ""
        rossoctl.io/inject: enabled
        rossoctl.io/spire: enabled
    spec:
      serviceAccountName: weather-coordinator
      initContainers:
        - name: diag-guard
          image: ghcr.io/rossoctl/cortex/proxy-init:v0.7.0-rc.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for port in 9091 9093 9094; do
                iptables -C INPUT -p tcp --dport "$port" ! -i lo -j REJECT --reject-with tcp-reset 2>/dev/null || \
                iptables -I INPUT 1 -p tcp --dport "$port" ! -i lo -j REJECT --reject-with tcp-reset
              done
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
              drop: ["ALL"]
      containers:
        - name: agent
          image: ghcr.io/rossoctl/rossoctl/backend:v0.8.0
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python3", "/opt/lab/coordinator.py"]
          env:
            - name: PORT
              value: "8001"
            - name: AGENT_B_URL
              value: "http://weather-service-advanced:8080/"
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: script
              mountPath: /opt/lab
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
      volumes:
        - name: script
          configMap:
            name: weather-coordinator-script
---
apiVersion: v1
kind: Service
metadata:
  name: weather-coordinator
  namespace: team1
  labels:
    app.kubernetes.io/name: weather-coordinator
spec:
  selector:
    app.kubernetes.io/name: weather-coordinator
  ports:
    - name: http
      port: 8080
      targetPort: 8001
