[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-lct"
version = "1.0.0"
description = "Lineage Capability Tree (LCT): Full-Lifecycle Cryptographic Governance for Cross-Organization Multi-Agent & MCP Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "PyYAML>=6.0.1",
    "jwcrypto>=1.5.0",
]

[tool.setuptools]
package-dir = {"lineage" = "."}
packages = [
    "lineage",
    "lineage.a2a",
    "lineage.agents",
    "lineage.audit",
    "lineage.common",
    "lineage.federation",
    "lineage.identity",
    "lineage.k8s",
    "lineage.multihost",
    "lineage.oauth_sts",
    "lineage.protocol",
    "lineage.registry",
    "lineage.resilience",
    "lineage.revocation",
    "lineage.sdk",
    "lineage.sdk.python",
    "lineage.sidecar",
    "lineage.tests",
    "lineage.verifier",
]
