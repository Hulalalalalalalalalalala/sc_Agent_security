            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
      containers:
        - name: alpha-revocation
          image: lineage-lct:m3
          imagePullPolicy: Never
          args: ["--role", "domain-revocation"]
          env:
            - name: LOCAL_CA_URL
              value: "http://alpha-ca.lineage-alpha.svc.cluster.local:8090"
            - name: PEER_CA_URLS
              value: "org-beta.io=http://beta-ca.lineage-beta.svc.cluster.local:8090,org-payment.io=http://payment-ca.lineage-pay.svc.cluster.local:8090"
            - name: PEER_REVOCATION_URLS
              value: "org-beta.io=http://beta-revocation.lineage-beta.svc.cluster.local:8092,org-payment.io=http://payment-revocation.lineage-pay.svc.cluster.local:8092"
            - name: LCT_MTLS_RAM_DIR
              value: "/var/run/lct-mtls-ram"
          ports:
            - containerPort: 8092
              name: http
          volumeMounts:
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
            - name: lct-mtls-ram
              mountPath: /var/run/lct-mtls-ram
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-revocation
  namespace: lineage-alpha
spec:
  selector:
    app: alpha-revocation
  ports:
    - name: http
      port: 8092
      targetPort: 8092
---
