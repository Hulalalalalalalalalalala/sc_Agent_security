# -----------------------------------------------------------------------------
# Keyless Independent Third-Party Audit Center: `lineage-ctrl`
# Holds ZERO CA private keys and mounts ZERO Kubernetes ServiceAccount tokens!
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-collector
  namespace: lineage-ctrl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-collector
  namespace: lineage-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-collector
  template:
    metadata:
      labels:
        app: audit-collector
    spec:
      serviceAccountName: audit-collector
      automountServiceAccountToken: false
      containers:
        - name: audit-collector
          image: lineage-lct:m3
          imagePullPolicy: Never
          args: ["--role", "federated-audit-collector"]
          env:
            - name: PEER_CA_URLS
              value: "org-alpha.io=http://alpha-ca.lineage-alpha.svc.cluster.local:8090,org-beta.io=http://beta-ca.lineage-beta.svc.cluster.local:8090,org-payment.io=http://payment-ca.lineage-pay.svc.cluster.local:8090"
          ports:
            - containerPort: 8093
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: audit-collector
  namespace: lineage-ctrl
spec:
  selector:
    app: audit-collector
  ports:
    - name: http
      port: 8093
      targetPort: 8093
