# =============================================================================
# Milestone 3: Physically Autonomous Multi-Domain Control Plane + Keyless Audit
#
# Physical Isolation Invariants:
# 1. `lineage-alpha` (`org-alpha.io` autonomous domain):
#      - `alpha-ca` (:8090): Holds ONLY `org-alpha.io` ES256 & X.509 Root CA
#        private keys in RAM; accepts ONLY `lineage-alpha` K8s SA JWTs!
#      - `alpha-revocation` (:8092): Authoritative prefix trie for `org-alpha.io`,
#        peered with `beta-revocation` & `payment-revocation`.
#      - `alpha-directory` (:8091): Local `org-alpha.io` A2A v1.0 AgentCard
#        registry, peered with `beta-directory` & `payment-directory`.
# 2. `lineage-beta` (`org-beta.io` autonomous domain):
#      - `beta-ca` (:8090): Holds ONLY `org-beta.io` private keys in RAM;
#        accepts ONLY `lineage-beta` K8s SA JWTs!
#      - `beta-revocation` (:8092) & `beta-directory` (:8091).
# 3. `lineage-pay` (`org-payment.io` autonomous domain):
#      - `payment-ca` (:8090): Holds ONLY `org-payment.io` private keys in RAM;
#        accepts ONLY `lineage-pay` K8s SA JWTs!
#      - `payment-revocation` (:8092) & `payment-directory` (:8091).
# 4. `lineage-ctrl` (Keyless Independent Third-Party Audit Center):
#      - ONLY `audit-collector` (:8093): Pulls public JWKS/X.509 bundles from
#        `alpha-ca`, `beta-ca`, `payment-ca`; holds ZERO CA private keys and
#        mounts ZERO Kubernetes ServiceAccount tokens!
# =============================================================================

# -----------------------------------------------------------------------------
# Domain 1 Autonomous Control Plane: `lineage-alpha` (`org-alpha.io`)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-ca
  namespace: lineage-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-ca
  namespace: lineage-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-ca
  template:
    metadata:
      labels:
        app: alpha-ca
        lct.io/trust-domain: org-alpha.io
    spec:
      serviceAccountName: alpha-ca
      automountServiceAccountToken: false
      volumes:
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: k8s-api-token
                  expirationSeconds: 1800
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: alpha-ca
          image: lineage-lct:m3
          imagePullPolicy: Never
          args: ["--role", "domain-ca"]
          env:
            - name: TRUST_DOMAIN
              value: "org-alpha.io"
            - name: ALLOWED_K8S_NAMESPACE
              value: "lineage-alpha"
            - name: AUTHORIZED_GATEWAY_SA
              value: "e2e-user-gateway"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.lineage-ctrl.svc.cluster.local:8093"
          ports:
            - containerPort: 8090
              name: http
          volumeMounts:
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-ca
  namespace: lineage-alpha
spec:
  selector:
    app: alpha-ca
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-revocation
  namespace: lineage-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-revocation
  namespace: lineage-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-revocation
  template:
    metadata:
      labels:
        app: alpha-revocation
        lct.io/trust-domain: org-alpha.io
    spec:
      serviceAccountName: alpha-revocation
      automountServiceAccountToken: false
      volumes:
        - name: lct-sa-token
