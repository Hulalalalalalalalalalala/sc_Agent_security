# =============================================================================
# Cluster 3 (`kind-lct-org-pay`): Organization Payment (`org-payment.io`)
# Pod CIDR: 10.243.0.0/16 | Service CIDR: 10.99.0.0/16
#
# Strict Boundary Hardening:
#   - `payment-ca`: `:8090` strictly ClusterIP; `:8094` (NodePort 32094) read-only bundle ONLY!
#   - `payment-directory`: `:8091` strictly ClusterIP; `:8491` (NodePort 32491) mTLS 1.3 federation ONLY!
#   - `payment-revocation`: `:8092` strictly ClusterIP; `:8492` (NodePort 32492) mTLS 1.3 federation ONLY!
#   - `settlement-converger` (`2/2`, NodePort 32441), `travel-ops-mcp` (`2/2`, NodePort 32442),
#     `payment-vault-mcp` (`2/2`, NodePort 32443).
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lineage-pay
  labels:
    lct.io/trust-domain: org-payment.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-ca
  namespace: lineage-pay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-ca
  namespace: lineage-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-ca
  template:
    metadata:
      labels:
        app: payment-ca
        lct.io/trust-domain: org-payment.io
    spec:
      serviceAccountName: payment-ca
      automountServiceAccountToken: false
      volumes:
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: k8s-api-token
                  expirationSeconds: 1800
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: payment-ca
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "domain-ca"]
          env:
            - name: TRUST_DOMAIN
              value: "org-payment.io"
            - name: ALLOWED_K8S_NAMESPACE
              value: "lineage-pay"
            - name: CA_FEDERATION_PORT
              value: "8094"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
          ports:
            - containerPort: 8090
              name: ca-internal
            - containerPort: 8094
              name: ca-fed-ro
          volumeMounts:
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-ca
  namespace: lineage-pay
spec:
  type: ClusterIP
  selector:
    app: payment-ca
  ports:
    - name: ca-internal
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: payment-ca-federation
  namespace: lineage-pay
spec:
  type: NodePort
  selector:
    app: payment-ca
  ports:
    - name: ca-fed-ro
      port: 8094
      targetPort: 8094
      nodePort: 32094
---
