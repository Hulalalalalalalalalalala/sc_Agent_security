metadata:
  name: settlement-converger
  namespace: lineage-pay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-converger
  namespace: lineage-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-converger
  template:
    metadata:
      labels:
        app: settlement-converger
        lct.io/trust-domain: org-payment.io
    spec:
      serviceAccountName: settlement-converger
      automountServiceAccountToken: false
      volumes:
        - name: lct-loopback
          emptyDir:
            medium: Memory
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: app
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "app-converger"]
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434/v1"
            - name: LLM_MODEL
              value: "qwen2.5:3b"
            - name: PAYMENT_MCP_URL
              value: "https://payment-vault-mcp.org-payment.io:32443/mcp"
            - name: LCT_ENABLE_FAULT_INJECTION
              value: "true"
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
              readOnly: true
        - name: lct-sidecar
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "sidecar"]
          env:
            - name: LOCAL_CA_URL
              value: "http://payment-ca.lineage-pay.svc.cluster.local:8090"
            - name: PEER_CA_URLS
              value: "org-alpha.io=http://alpha-ca.org-alpha.io:30094,org-beta.io=http://beta-ca.org-beta.io:31094"
            - name: DIRECTORY_URL
              value: "http://payment-directory.lineage-pay.svc.cluster.local:8091"
            - name: REVOCATION_URL
              value: "http://payment-revocation.lineage-pay.svc.cluster.local:8092"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
            - name: PUBLIC_ORIGIN
              value: "https://settlement-converger.org-payment.io:32441"
            - name: SIDECAR_INBOUND_PORT
              value: "8443"
            - name: AGENT_SKILLS
              value: "settlement.converge"
            - name: AGENT_PRIORITY
              value: "10"
            - name: AGENT_DISPLAY_NAME
              value: "Settlement Converger C"
            - name: LCT_ENABLE_FAULT_INJECTION
              value: "true"
            - name: LCT_MTLS_RAM_DIR
              value: "/var/run/lct-mtls-ram"
          ports:
            - containerPort: 8443
              name: lct-mtls
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
            - name: lct-mtls-ram
              mountPath: /var/run/lct-mtls-ram
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"
            initialDelaySeconds: 2
            periodSeconds: 3
