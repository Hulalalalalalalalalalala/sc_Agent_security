metadata:
  name: flight-specialist
  namespace: lineage-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-specialist
  template:
    metadata:
      labels:
        app: flight-specialist
        lct.io/trust-domain: org-beta.io
    spec:
      serviceAccountName: flight-specialist
      automountServiceAccountToken: false
      volumes:
        - name: lct-loopback
          emptyDir:
            medium: Memory
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: app
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "app-flight"]
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434/v1"
            - name: LLM_MODEL
              value: "qwen2.5:3b"
            - name: TRAVEL_MCP_URL
              value: "https://travel-ops-mcp.org-payment.io:32442/mcp"
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
              readOnly: true
        - name: lct-sidecar
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "sidecar"]
          env:
            - name: LOCAL_CA_URL
              value: "http://beta-ca.lineage-beta.svc.cluster.local:8090"
            - name: PEER_CA_URLS
              value: "org-alpha.io=http://alpha-ca.org-alpha.io:30094,org-payment.io=http://payment-ca.org-payment.io:32094"
            - name: DIRECTORY_URL
              value: "http://beta-directory.lineage-beta.svc.cluster.local:8091"
            - name: REVOCATION_URL
              value: "http://beta-revocation.lineage-beta.svc.cluster.local:8092"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
            - name: PUBLIC_ORIGIN
              value: "https://flight-specialist.org-beta.io:31441"
            - name: SIDECAR_INBOUND_PORT
              value: "8443"
            - name: AGENT_SKILLS
              value: "travel.flight"
            - name: AGENT_PRIORITY
              value: "10"
            - name: AGENT_DISPLAY_NAME
              value: "Flight Specialist B1"
            - name: LCT_MTLS_RAM_DIR
              value: "/var/run/lct-mtls-ram"
          ports:
            - containerPort: 8443
              name: lct-mtls
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
            - name: lct-mtls-ram
              mountPath: /var/run/lct-mtls-ram
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"
            initialDelaySeconds: 2
            periodSeconds: 3
