# =============================================================================
# Cluster 2 (`kind-lct-org-beta`): Organization Beta (`org-beta.io`)
# Pod CIDR: 10.242.0.0/16 | Service CIDR: 10.98.0.0/16
#
# Strict Boundary Hardening:
#   - `beta-ca`: `:8090` strictly ClusterIP; `:8094` (NodePort 31094) read-only bundle ONLY!
#   - `beta-directory`: `:8091` strictly ClusterIP; `:8491` (NodePort 31491) mTLS 1.3 federation ONLY!
#   - `beta-revocation`: `:8092` strictly ClusterIP; `:8492` (NodePort 31492) mTLS 1.3 federation ONLY!
#   - `flight-specialist` (`2/2`, NodePort 31441), `hotel-specialist-primary` (`2/2`, NodePort 31442),
#     `hotel-specialist-backup` (`2/2`, NodePort 31443).
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lineage-beta
  labels:
    lct.io/trust-domain: org-beta.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beta-ca
  namespace: lineage-beta
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-ca
  namespace: lineage-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-ca
  template:
    metadata:
      labels:
        app: beta-ca
        lct.io/trust-domain: org-beta.io
    spec:
      serviceAccountName: beta-ca
      automountServiceAccountToken: false
      volumes:
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: k8s-api-token
                  expirationSeconds: 1800
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: beta-ca
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "domain-ca"]
          env:
            - name: TRUST_DOMAIN
              value: "org-beta.io"
            - name: ALLOWED_K8S_NAMESPACE
              value: "lineage-beta"
            - name: CA_FEDERATION_PORT
              value: "8094"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
          ports:
            - containerPort: 8090
              name: ca-internal
            - containerPort: 8094
              name: ca-fed-ro
          volumeMounts:
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: beta-ca
  namespace: lineage-beta
spec:
  type: ClusterIP
  selector:
    app: beta-ca
  ports:
    - name: ca-internal
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: beta-ca-federation
  namespace: lineage-beta
spec:
  type: NodePort
  selector:
    app: beta-ca
  ports:
    - name: ca-fed-ro
      port: 8094
      targetPort: 8094
      nodePort: 31094
---
