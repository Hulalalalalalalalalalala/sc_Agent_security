# =============================================================================
# Cluster 4 (`kind-lct-audit`): Independent Keyless Audit Center (`org-audit.io`)
# Pod CIDR: 10.244.0.0/16 | Service CIDR: 10.100.0.0/16
# Holds ZERO CA private keys and mounts ZERO Kubernetes ServiceAccount tokens!
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lineage-ctrl
  labels:
    lct.io/cluster-role: audit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-collector
  namespace: lineage-ctrl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-collector
  namespace: lineage-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-collector
  template:
    metadata:
      labels:
        app: audit-collector
    spec:
      serviceAccountName: audit-collector
      automountServiceAccountToken: false
      containers:
        - name: audit-collector
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "federated-audit-collector"]
          env:
            - name: PEER_CA_URLS
              value: "org-alpha.io=http://alpha-ca.org-alpha.io:30094,org-beta.io=http://beta-ca.org-beta.io:31094,org-payment.io=http://payment-ca.org-payment.io:32094"
          ports:
            - containerPort: 8093
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: audit-collector
  namespace: lineage-ctrl
spec:
  type: NodePort
  selector:
    app: audit-collector
  ports:
    - name: http
      port: 8093
      targetPort: 8093
      nodePort: 30893
