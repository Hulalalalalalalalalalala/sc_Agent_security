                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
      containers:
        - name: alpha-revocation
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "domain-revocation"]
          env:
            - name: LOCAL_CA_URL
              value: "http://alpha-ca.lineage-alpha.svc.cluster.local:8090"
            - name: PEER_CA_URLS
              value: "org-beta.io=http://beta-ca.org-beta.io:31094,org-payment.io=http://payment-ca.org-payment.io:32094"
            - name: PEER_REVOCATION_URLS
              value: "org-beta.io=https://beta-revocation.org-beta.io:31492,org-payment.io=https://payment-revocation.org-payment.io:32492"
            - name: REVOCATION_FEDERATION_PORT
              value: "8492"
            - name: LCT_MTLS_RAM_DIR
