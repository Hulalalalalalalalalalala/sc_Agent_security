apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-alpha
  namespace: lineage-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-alpha
  namespace: lineage-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-alpha
  template:
    metadata:
      labels:
        app: orchestrator-alpha
        lct.io/trust-domain: org-alpha.io
    spec:
      serviceAccountName: orchestrator-alpha
      automountServiceAccountToken: false
      volumes:
        - name: lct-loopback
          emptyDir:
            medium: Memory
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: app
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "app-orchestrator"]
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434/v1"
            - name: LLM_MODEL
              value: "qwen2.5:3b"
            - name: LCT_ENABLE_FAULT_INJECTION
              value: "true"
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
              readOnly: true
        - name: lct-sidecar
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "sidecar"]
          env:
            - name: LOCAL_CA_URL
              value: "http://alpha-ca.lineage-alpha.svc.cluster.local:8090"
            - name: PEER_CA_URLS
              value: "org-beta.io=http://beta-ca.org-beta.io:31094,org-payment.io=http://payment-ca.org-payment.io:32094"
            - name: DIRECTORY_URL
              value: "http://alpha-directory.lineage-alpha.svc.cluster.local:8091"
            - name: REVOCATION_URL
              value: "http://alpha-revocation.lineage-alpha.svc.cluster.local:8092"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
            - name: PUBLIC_ORIGIN
              value: "https://orchestrator-alpha.org-alpha.io:30441"
            - name: SIDECAR_INBOUND_PORT
              value: "8443"
            - name: AGENT_SKILLS
              value: "travel.orchestrate"
            - name: AGENT_PRIORITY
              value: "10"
            - name: AGENT_DISPLAY_NAME
              value: "Orchestrator Alpha"
            - name: LCT_ENABLE_FAULT_INJECTION
              value: "true"
            - name: LCT_MTLS_RAM_DIR
              value: "/var/run/lct-mtls-ram"
          ports:
            - containerPort: 8443
              name: lct-mtls
          volumeMounts:
            - name: lct-loopback
              mountPath: /var/run/lct-loopback
            - name: lct-mtls-ram
              mountPath: /var/run/lct-mtls-ram
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-alpha
  namespace: lineage-alpha
spec:
  type: NodePort
  selector:
    app: orchestrator-alpha
  ports:
    - name: lct-mtls
      port: 8443
      targetPort: 8443
      nodePort: 30441
---
