      labels:
        app: e2e-user-gateway
        lct.io/trust-domain: org-alpha.io
    spec:
      serviceAccountName: e2e-user-gateway
      automountServiceAccountToken: false
      volumes:
        - name: lct-mtls-ram
          emptyDir:
            medium: Memory
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
                  audience: lct-federation-ca
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: gateway
          image: lineage-lct:m4
          imagePullPolicy: Never
