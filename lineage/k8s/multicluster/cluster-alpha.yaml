              mountPath: /var/run/lct-sa
              readOnly: true
            - name: lct-mtls-ram
              mountPath: /var/run/lct-mtls-ram
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 1
            periodSeconds: 2
