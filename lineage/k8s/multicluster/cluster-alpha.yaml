# =============================================================================
# Cluster 1 (`kind-lct-org-alpha`): Organization Alpha (`org-alpha.io`)
# Pod CIDR: 10.241.0.0/16 | Service CIDR: 10.97.0.0/16
#
# Strict Boundary Hardening:
#   - `alpha-ca`: `:8090` strictly ClusterIP; `:8094` (NodePort 30094) read-only bundle ONLY!
#   - `alpha-directory`: `:8091` strictly ClusterIP; `:8491` (NodePort 30491) mTLS 1.3 federation ONLY!
#   - `alpha-revocation`: `:8092` strictly ClusterIP; `:8492` (NodePort 30492) mTLS 1.3 federation ONLY!
#   - `orchestrator-alpha`: `2/2` Pod, `:8443` (NodePort 30441) bidirectional mTLS 1.3 + A2A v1.0!
#   - `e2e-user-gateway`: `1/1` Pod, `:19090` (NodePort 30990) S3B sync trigger.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lineage-alpha
  labels:
    lct.io/trust-domain: org-alpha.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-ca
  namespace: lineage-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-ca
  namespace: lineage-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-ca
  template:
    metadata:
      labels:
        app: alpha-ca
        lct.io/trust-domain: org-alpha.io
    spec:
      serviceAccountName: alpha-ca
      automountServiceAccountToken: false
      volumes:
        - name: lct-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: k8s-api-token
                  expirationSeconds: 1800
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: alpha-ca
          image: lineage-lct:m4
          imagePullPolicy: Never
          args: ["--role", "domain-ca"]
          env:
            - name: TRUST_DOMAIN
              value: "org-alpha.io"
            - name: ALLOWED_K8S_NAMESPACE
              value: "lineage-alpha"
            - name: AUTHORIZED_GATEWAY_SA
              value: "e2e-user-gateway"
            - name: CA_FEDERATION_PORT
              value: "8094"
            - name: AUDIT_COLLECTOR_URL
              value: "http://audit-collector.org-audit.io:30893"
          ports:
            - containerPort: 8090
              name: ca-internal
            - containerPort: 8094
              name: ca-fed-ro
          volumeMounts:
            - name: lct-sa-token
              mountPath: /var/run/lct-sa
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-ca
  namespace: lineage-alpha
spec:
  type: ClusterIP
  selector:
    app: alpha-ca
  ports:
    - name: ca-internal
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-ca-federation
  namespace: lineage-alpha
spec:
  type: NodePort
  selector:
    app: alpha-ca
  ports:
    - name: ca-fed-ro
      port: 8094
      targetPort: 8094
      nodePort: 30094
---
